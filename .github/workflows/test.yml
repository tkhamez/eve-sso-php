name: test

on: [push]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - php-version: '8.1'
            guzzle: '^7.7'
          - php-version: '8.2'
            guzzle: '^7.7'
          - php-version: '8.3'
            guzzle: '^7.7'
          - php-version: '8.4'
            guzzle: '^8.0'
          - php-version: '8.5'
            guzzle: '^8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: gmp
          tools: composer:v2
      - name: Install
        run: composer install
      - name: Use Guzzle 7
        if: matrix.guzzle == '^7.7'
        run: composer update "guzzlehttp/guzzle:^7.7" --with-all-dependencies --no-interaction
      - name: Test
        run: vendor/bin/phpunit
